name: fuzz-runner

on:
  workflow_call:
    inputs:
      targets:
        description: Newline-separated libFuzzer target names
        required: true
        type: string
      timeout_minutes:
        description: Job timeout, including setup
        required: false
        type: number
        default: 100

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Weekly fuzz (90 minutes)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: checkout caller repository
        uses: actions/checkout@v4

      - name: install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview, rust-src

      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: fuzz every target for a combined 90 minutes
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          mapfile -t targets <<< "$TARGETS"
          n=${#targets[@]}
          if [ "$n" -eq 0 ]; then
            echo "no fuzz targets supplied" >&2
            exit 1
          fi
          total=5400
          base=$((total / n))
          remainder=$((total % n))
          for i in "${!targets[@]}"; do
            name="${targets[$i]}"
            [ -n "$name" ] || continue
            seconds=$base
            if [ "$i" -lt "$remainder" ]; then
              seconds=$((seconds + 1))
            fi
            echo "== $name (${seconds}s)"
            mkdir -p "fuzz/corpus/$name"
            cargo +nightly fuzz run "$name" -- \
              -max_total_time="$seconds" \
              -rss_limit_mb=2048 \
              -timeout=10 \
              -max_len=16384
          done

      - name: upload crashes and new corpus entries
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          if-no-files-found: ignore
