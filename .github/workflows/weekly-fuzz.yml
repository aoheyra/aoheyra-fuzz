name: weekly-fuzz

on:
  schedule:
    # Sunday 00:00 IST is Saturday 18:30 UTC.
    - cron: '30 18 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: ao-mesh-fuzz
          - crate: ao-network-fuzz
          - crate: ao-idents-fuzz
    steps:
      - name: checkout fuzz repository
        uses: actions/checkout@v4

      - name: install nightly with sanitizer support
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview, rust-src

      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: run every target for its share of the 90-minute budget
        working-directory: fuzz/${{ matrix.crate }}
        run: |
          set -euo pipefail
          total=5400
          mapfile -t targets < <(find fuzz_targets -maxdepth 1 -name '*.rs' -printf '%f\n' | sed 's/\.rs$//' | sort)
          n=${#targets[@]}
          if [ "$n" -eq 0 ]; then
            echo 'no fuzz targets found' >&2
            exit 1
          fi
          base=$((total / n))
          remainder=$((total % n))
          for i in "${!targets[@]}"; do
            name=${targets[$i]}
            per=$base
            if [ "$i" -lt "$remainder" ]; then
              per=$((per + 1))
            fi
            echo "== $name (${per}s)"
            mkdir -p "corpus/$name"
            if [ -d "seeds/$name" ]; then
              cargo +nightly fuzz run "$name" "corpus/$name" "seeds/$name" -- \
                -max_total_time="$per" \
                -rss_limit_mb=2048 \
                -timeout=10 \
                -max_len=16384
            else
              cargo +nightly fuzz run "$name" "corpus/$name" -- \
                -max_total_time="$per" \
                -rss_limit_mb=2048 \
                -timeout=10 \
                -max_len=16384
            fi
          done

      - name: upload crashes and corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings-${{ matrix.crate }}
          path: |
            fuzz/${{ matrix.crate }}/artifacts/
            fuzz/${{ matrix.crate }}/corpus/
          if-no-files-found: ignore

  aoheyra-docs:
    name: aoheyra docs integrity
    runs-on: ubuntu-latest
    steps:
      - name: checkout docs repository
        uses: actions/checkout@v4
        with:
          repository: aoheyra/aoheyra
          ref: master

      - name: check local documentation links and workflow syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          import yaml

          bad = []
          for path in Path('.').rglob('*.md'):
              text = path.read_text(encoding='utf-8')
              for match in re.finditer(r'\[[^\]]*\]\(([^)]+)\)', text):
                  target = match.group(1).split('#', 1)[0]
                  if not target or '://' in target or target.startswith('mailto:'):
                      continue
                  if not (path.parent / target).exists():
                      bad.append(f'{path}: missing {target}')
          for path in Path('.github/workflows').glob('*.y*ml'):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          if bad:
              print('\n'.join(bad), file=sys.stderr)
              sys.exit(1)
          print('documentation links and workflow syntax are valid')
          PY
