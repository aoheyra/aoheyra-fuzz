name: weekly-fuzz

on:
  schedule:
    # Sunday 00:00 IST is Saturday 18:30 UTC.
    - cron: '30 18 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: dispatch ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: aoMesh
            workflow: fuzz.yml
          - repo: aoNetwork
            workflow: fuzz.yml
          - repo: aoIdents
            workflow: fuzz.yml
    steps:
      - name: start the 90-minute fuzz run in ${{ matrix.repo }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FUZZ_DISPATCH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'aoheyra',
              repo: '${{ matrix.repo }}',
              workflow_id: '${{ matrix.workflow }}',
              ref: 'master',
              inputs: { duration_seconds: '5400' }
            })

  aoheyra-docs:
    name: aoheyra docs integrity
    runs-on: ubuntu-latest
    steps:
      - name: checkout docs repository
        uses: actions/checkout@v4
        with:
          repository: aoheyra/aoheyra
          ref: master

      - name: check local documentation links and workflow syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          import yaml

          bad = []
          for path in Path('.').rglob('*.md'):
              text = path.read_text(encoding='utf-8')
              for match in re.finditer(r'\[[^\]]*\]\(([^)]+)\)', text):
                  target = match.group(1).split('#', 1)[0]
                  if not target or '://' in target or target.startswith('mailto:'):
                      continue
                  if not (path.parent / target).exists():
                      bad.append(f'{path}: missing {target}')
          for path in Path('.github/workflows').glob('*.y*ml'):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          if bad:
              print('\n'.join(bad), file=sys.stderr)
              sys.exit(1)
          print('documentation links and workflow syntax are valid')
          PY
