[package]
name = "ao_idents_fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rand_core = "0.6"
ao_idents = { git = "https://github.com/aoheyra/aoIdents" }

[[bin]]
name = "seal_decode_open"
path = "fuzz_targets/seal_decode_open.rs"
test = false
doc = false

[[bin]]
name = "card_decode"
path = "fuzz_targets/card_decode.rs"
test = false
doc = false

[[bin]]
name = "signed_decode"
path = "fuzz_targets/signed_decode.rs"
test = false
doc = false

[[bin]]
name = "group_decode"
path = "fuzz_targets/group_decode.rs"
test = false
doc = false

[[bin]]
name = "prekey_decode"
path = "fuzz_targets/prekey_decode.rs"
test = false
doc = false

[[bin]]
name = "handshake_read"
path = "fuzz_targets/handshake_read.rs"
test = false
doc = false

[workspace]
members = ["."]
