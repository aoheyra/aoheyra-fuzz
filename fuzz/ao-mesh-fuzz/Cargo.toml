[package]
name = "ao_mesh_fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rand = "0.9"
ao_mesh = { git = "https://github.com/aoheyra/aoMesh" }
ao_idents = { git = "https://github.com/aoheyra/aoIdents" }
ao_network = { git = "https://github.com/aoheyra/aoNetwork" }

[[bin]]
name = "packet_decode"
path = "fuzz_targets/packet_decode.rs"
test = false
doc = false

[[bin]]
name = "engine_input"
path = "fuzz_targets/engine_input.rs"
test = false
doc = false

[[bin]]
name = "sync_frames"
path = "fuzz_targets/sync_frames.rs"
test = false
doc = false

[workspace]
members = ["."]
